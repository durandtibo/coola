site_name: coola
site_url: "https://durandtibo.github.io/coola/"
# A warning (for example a broken link or cross reference) fails the build.
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.expand
    - content.code.copy
    - content.code.select
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  custom_dir: overrides

nav:
  - Home: index.md
  - get_started.md
  - User Guide:
      - uguide/display.md
      - uguide/equality.md
      - uguide/equality_tester.md
      - uguide/extending.md
      - uguide/factory.md
      - uguide/formatting.md
      - uguide/hashing.md
      - uguide/identifier.md
      - uguide/io.md
      - uguide/iterator.md
      - uguide/jsonable.md
      - uguide/nested.md
      - uguide/nested_data.md
      - uguide/random.md
      - uguide/recursive.md
      - uguide/reducer.md
      - uguide/registry.md
      - uguide/rounding.md
      - uguide/summary.md
      - uguide/testing.md
      - uguide/utils.md
      - uguide/validation.md
  - Developer Guide:
      - dev/development.md
      - dev/architecture.md
      - dev/display.md
      - dev/equality.md
      - dev/factory.md
      - dev/formatting.md
      - dev/hashing.md
      - dev/identifier.md
      - dev/io.md
      - dev/iterator.md
      - dev/jsonable.md
      - dev/nested.md
      - dev/random.md
      - dev/recursive.md
      - dev/reducer.md
      - dev/registry.md
      - dev/rounding.md
      - dev/summary.md
      - dev/testing.md
      - dev/utils.md
      - dev/validation.md
      - dev/add_backend.md
  - Migration:
      - migration/v0.11_to_v1.0.md
      - migration/v1.1_to_v2.0.md
  - Reference:
      - refs/display.md
      - refs/equality.md
      - refs/factory.md
      - refs/formatting.md
      - refs/hashing.md
      - refs/identifier.md
      - refs/io.md
      - refs/iterator.md
      - refs/jsonable.md
      - refs/nested.md
      - refs/random.md
      - refs/recursive.md
      - refs/reducer.md
      - refs/registry.md
      - refs/rounding.md
      - refs/summary.md
      - refs/testing.md
      - refs/utils.md
      - refs/validation.md
  - GitHub: https://github.com/durandtibo/coola

repo_url: https://github.com/durandtibo/coola
repo_name: durandtibo/coola

markdown_extensions:
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [../src]
          extensions:
            - griffe_inherited_docstrings
          options:
            allow_inspection: true
            docstring_style: google
            separate_signature: true
            show_bases: true
            show_object_full_path: true
            show_root_full_path: true
            show_root_heading: true
            show_root_toc_entry: true
            show_signature: true
            show_signature_annotations: true
            show_source: false
            signature_crossrefs: true

extra:
  version:
    method: mike

copyright: Copyright &copy; 2022 - present Thibaut Durand
