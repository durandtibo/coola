# Composite action shared by every workflow that verifies an already-installed
# coola package (nightly-test-package.yaml, nightly-test-package-dep.yaml,
# nightly-test-package-extras.yaml).
# Prints the resolved dependency tree for debugging, then runs the same
# package-level sanity checks (imports, version, ...) used everywhere else, so
# the three callers can't drift on what "verify the package" means.
# Requires uv and the package to already be installed, and the repository to
# already be checked out (tests/package/checks.py must be present).

name: Verify installed package
description: Show the dependency tree and run tests/package/checks.py against an installed package
inputs:
  extra:
    description: Extra installed with the package (its library must be importable); empty for none
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Show dependency tree
      shell: bash
      run: |
        uv pip tree --show-version-specifiers

    - name: Run some checks
      shell: bash
      env:
        PACKAGE_EXTRA: ${{ inputs.extra }}
      run: |
        python tests/package/checks.py --extra "$PACKAGE_EXTRA"
