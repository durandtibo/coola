# Composite action shared by every automation workflow that needs to push
# commits/open PRs as the bot app (pin-action.yaml, pre-commit-autoupdate.yaml,
# update-deps.yaml, generate-package-versions.yaml). Generates a short-lived
# GitHub App token scoped to the requested permissions, then checks out the
# repository with that token so later steps (e.g. create-pull-request) can
# push. Keeping this in one place avoids the four callers drifting.

name: Bot checkout
description: Generate a GitHub App token and check out the repository with it

inputs:
  client-id:
    description: GitHub App client ID
    required: true
  private-key:
    description: GitHub App private key
    required: true
  permission-contents:
    description: Requested "contents" permission for the app token
    required: false
    default: write
  permission-pull-requests:
    description: Requested "pull-requests" permission for the app token
    required: false
    default: write
  permission-workflows:
    description: Requested "workflows" permission for the app token
    required: false
    default: ""

outputs:
  token:
    description: The generated GitHub App token
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-workflows: ${{ inputs.permission-workflows }}

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      with:
        token: ${{ steps.app-token.outputs.token }}
        persist-credentials: false
