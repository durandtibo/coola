# Dependency compatibility testing workflow.
# Tests the package with different versions of optional dependencies.
# Ensures compatibility across supported dependency version ranges.

name: Test - Dependencies
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Get dependency version information from config file
  get-versions:
    uses: ./.github/workflows/get-versions.yaml

  # One job per optional dependency, driven by the package names/versions from
  # get-versions instead of a hardcoded list, so a new optional dependency
  # only needs to be added to dev/config/package_versions.json.
  test-dep:
    needs: get-versions
    strategy:
      fail-fast: false
      matrix:
        package-name: ${{ fromJson(needs.get-versions.outputs.package_names) }}
    uses: ./.github/workflows/test-code-dep.yaml
    with:
      package-name: ${{ matrix.package-name }}
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions)[matrix.package-name]) }}
