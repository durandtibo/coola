name: Get Package Metadata

# This reusable workflow wraps the extract-pyproject-metadata-action composite
# action so its output can be used from a job's `needs:` (a `uses:` composite
# action alone can't be, since it produces a step output, not a job output).
# It reads the project name, version and the version specifiers of the
# requested dependencies from pyproject.toml, so the workflows never repeat
# them.
#
# Usage:
#   jobs:
#     get-metadata:
#       uses: ./.github/workflows/lib-get-package-metadata.yaml
#
#     build:
#       needs: get-metadata
#       runs-on: ubuntu-latest
#       steps:
#         - name: Show the package name
#           run: echo "${{ needs.get-metadata.outputs.name }}"

on:
  workflow_call:
    inputs:
      dependencies:
        description: >
          JSON array of the dependency names whose version specifier is read
          from pyproject.toml (e.g. '["numpy"]').
        required: false
        type: string
        default: "[]"
    outputs:
      name:
        description: "Project name, as declared in [project].name"
        value: ${{ jobs.get-metadata.outputs.name }}
      normalized_name:
        description: "Project name normalized per PEP 503, for an index URL or pip install"
        value: ${{ jobs.get-metadata.outputs.normalized_name }}
      version:
        description: "Project version, as declared in [project].version"
        value: ${{ jobs.get-metadata.outputs.version }}
      dependency_specifiers:
        description: "JSON object mapping each requested dependency to its version specifier"
        value: ${{ jobs.get-metadata.outputs.dependency_specifiers }}

  workflow_dispatch: # to trigger manually
    inputs:
      dependencies:
        required: false
        type: string
        default: "[]"

permissions: {}

jobs:
  get-metadata:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      name: ${{ steps.metadata.outputs.name }}
      normalized_name: ${{ steps.metadata.outputs.normalized-name }}
      version: ${{ steps.metadata.outputs.version }}
      dependency_specifiers: ${{ steps.metadata.outputs.dependency-specifiers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Get package metadata
        id: metadata
        uses: durandtibo/extract-pyproject-metadata-action@aa5867876178387ad9d5da757d157c5febfaef5d # ratchet:durandtibo/extract-pyproject-metadata-action@v0.3.1
        with:
          dependencies: ${{ inputs.dependencies }}
