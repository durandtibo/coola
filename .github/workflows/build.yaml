# Build and package validation workflow.
# Tests that the package can be built correctly as both source distribution and wheel.
# Validates package metadata, dependencies, and that the package is properly typed.

name: Build Tests
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Load the shared python-version matrix from dev/config/test_matrix.json
  get-matrix:
    uses: ./.github/workflows/get-test-matrix.yaml

  # Load the shared optional-dependency package names from dev/config/package_versions.json
  get-versions:
    uses: ./.github/workflows/get-versions.yaml

  # "" (no extra) is a baseline build, not a package name, so append it to the
  # names from get-versions rather than hardcoding the whole list.
  get-extras:
    needs: get-versions
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      extras: ${{ steps.extras.outputs.extras }}
    steps:
      - id: extras
        env:
          PACKAGE_NAMES: ${{ needs.get-versions.outputs.package_names }}
        run: |
          extras=$(echo "$PACKAGE_NAMES" | jq -c '[""] + .')
          echo "extras=$extras" >> "$GITHUB_OUTPUT"

  build:
    needs: get-extras
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        dist-type: ["sdist", "wheel"]
        package-extra: ${{ fromJson(needs.get-extras.outputs.extras) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Verify Build
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: coola
          package-extra: ${{ matrix.package-extra }}
          package-dependencies: ""
          dist-type: ${{ matrix.dist-type }}
      - name: Run package checks
        shell: bash
        run: |

          set -euo pipefail
          echo "🔍 Running package checks..."
          python tests/package_checks.py

          echo "✅ Package checks passed"
      - name: Check optional packages installation
        if: ${{ matrix.package-extra != '' }}
        shell: bash
        env:
          PACKAGE_EXTRA: ${{ matrix.package-extra }}
        run: |
          set -euo pipefail
          echo "🔍 Verifying if $PACKAGE_EXTRA is installed..."

          if ! uv pip list | grep -qE "^${PACKAGE_EXTRA}\s"; then
            echo "❌ Error: Package '$PACKAGE_EXTRA' not found in installed packages"
            echo "Installed packages:"
            uv pip list
            exit 1
          fi
          echo "✅ Package '$PACKAGE_EXTRA' is installed"

  build-all:
    needs: get-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        dist-type: ["sdist", "wheel"]
        # Test at least one full-extras build per supported Python version to
        # catch version-specific build regressions (e.g. free-threaded 3.13t/3.14t).
        python-version: ${{ fromJson(needs.get-matrix.outputs.test_matrix).python_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # ratchet:astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Verify Build
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: coola
          package-extra: all
          package-dependencies: ""
          dist-type: ${{ matrix.dist-type }}
          verify-sdist-extra: false
      - name: Run package checks
        run: |

          set -euo pipefail
          echo "🔍 Running package checks..."
          python tests/package_checks.py

          echo "✅ Package checks passed"
