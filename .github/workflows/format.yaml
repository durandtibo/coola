# Code formatting and linting workflow.
# Checks code formatting with black and code quality with ruff.
# Ensures code follows project style guidelines.

name: Format
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@59716ab8fb83cc7025548b3831c06b6f5c268f4f # ratchet:durandtibo/setup-venv-uv-action@v0.1.0

      # Check code formatting with black
      - name: Check format
        run: |
          inv check-format

      # Check code quality with ruff
      - name: Check lint
        run: |
          inv check-lint

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: "0.10.0"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run ShellCheck
        run: |
          shopt -s globstar
          echo "🔍 Running ShellCheck..."
          shellcheck -- **/*.sh || exit 1

      - name: Install shfmt
        env:
          SHFMT_VERSION: "3.10.0"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            -o /tmp/shfmt
          sudo install /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Run shfmt
        run: |
          shopt -s globstar
          echo "✨ Checking formatting using shfmt..."
          shfmt -d -- **/*.sh
