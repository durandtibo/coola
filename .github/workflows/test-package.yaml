# Reusable workflow for testing the installed package.
# Tests package installation from PyPI and validates basic functionality.
# Used to test stable releases, pre-releases, and different installation configurations.

name: Test Package
on:
  workflow_call:
    inputs:
      install-cmd:
        default: "uv pip install coola"
        description: "Command to install the package"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-26.04,
            ubuntu-24.04,
            ubuntu-22.04,
            ubuntu-26.04-arm,
            ubuntu-24.04-arm,
            ubuntu-22.04-arm,
            macos-latest,
            macos-26,
            macos-15,
            macos-14,
            macos-26-intel,
            macos-15-intel,
          ]
        python-version:
          ["3.14", "3.14t", "3.13", "3.13t", "3.12", "3.11", "3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      # Install uv package manager
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # ratchet:astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      # Install package from PyPI using custom install command
      - name: Install package
        run: |
          ${{ inputs.install-cmd }}
      - name: Show dependency tree

        # Display dependency tree

        shell: bash
        run: |2
          uv pip tree --show-version-specifiers
      # Run basic package checks (imports, version, etc.)
      - name: Run some checks
        run: |
          python tests/package_checks.py
