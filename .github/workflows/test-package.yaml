# Reusable workflow for testing the installed package.
# Tests package installation from PyPI and validates basic functionality.
# Used to test stable releases, pre-releases, and different installation configurations.

name: Test Package
on:
  workflow_call:
    inputs:
      install-cmd:
        default: "uv pip install coola"
        description: "Command to install the package"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Load the shared python-version/OS matrix from dev/config/test_matrix.json
  get-matrix:
    uses: ./.github/workflows/get-test-matrix.yaml

  test:
    needs: get-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.get-matrix.outputs.test_matrix).os_matrix }}
        python-version: ${{ fromJson(needs.get-matrix.outputs.test_matrix).python_versions }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      # Install uv package manager
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # ratchet:astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      # Install package from PyPI using custom install command
      - name: Install package
        env:
          INSTALL_CMD: ${{ inputs.install-cmd }}
        run: |
          $INSTALL_CMD
      # Display dependency tree

      - name: Show dependency tree
        shell: bash
        run: |

          uv pip tree --show-version-specifiers
      # Run basic package checks (imports, version, etc.)
      - name: Run some checks
        run: |
          python tests/package_checks.py
