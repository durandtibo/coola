# Dependency audit workflow.
# Checks the locked dependencies for known vulnerabilities with pip-audit,
# every week and on demand. Complements the dependency review of pull requests,
# which only looks at the dependencies that a pull request changes.

name: Dependency Audit
on:
  schedule:
    - cron: "30 6 * * 1" # Run every Monday at 6:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # ratchet:astral-sh/setup-uv@v10.3.0

      - name: Audit the locked dependencies
        run: |
          uv export --all-groups --no-hashes --no-emit-project --frozen > requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt --no-deps --disable-pip
