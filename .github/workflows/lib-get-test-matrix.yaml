name: Get Test Matrix

# This reusable workflow loads the shared Python-version and OS matrices from
# durandtibo/workflow-config-action's built-in default config and exposes
# them as a single output, so the supported version/OS lists only need to be
# updated in one place (that action's config) instead of being duplicated
# across every test-* workflow.
#
# Usage:
#   jobs:
#     get-matrix:
#       uses: ./.github/workflows/lib-get-test-matrix.yaml
#
#     test:
#       needs: get-matrix
#       strategy:
#         matrix:
#           python-version: ${{ fromJson(needs.get-matrix.outputs.test_matrix).python_versions }}
#           os: ${{ fromJson(needs.get-matrix.outputs.test_matrix).os_matrix }}

on:
  workflow_call:
    outputs:
      test_matrix:
        description: "JSON string containing python_versions, python_versions_standard, os_matrix and os_macos"
        value: ${{ jobs.get-matrix.outputs.test_matrix }}

  workflow_dispatch: # Allows manual triggering for testing purposes

permissions: {}

jobs:
  get-matrix:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      test_matrix: ${{ steps.build-matrix.outputs.test_matrix }}
    steps:
      - name: Load workflow config
        uses: durandtibo/workflow-config-action@293a1c5eff18a9c485359d32d3035fdaaddcb955 # ratchet:durandtibo/workflow-config-action@v0.3.0
        id: cfg

      - name: Build test matrix
        id: build-matrix
        env:
          PYTHON_VERSIONS: ${{ steps.cfg.outputs.python_versions }}
          PYTHON_VERSIONS_STANDARD: ${{ steps.cfg.outputs.python_versions_standard }}
          OS_UNIX: ${{ steps.cfg.outputs.os_unix }}
          OS_MACOS: ${{ steps.cfg.outputs.os_macos }}
        run: |
          test_matrix=$(jq -nc \
            --argjson python_versions "$PYTHON_VERSIONS" \
            --argjson python_versions_standard "$PYTHON_VERSIONS_STANDARD" \
            --argjson os_matrix "$OS_UNIX" \
            --argjson os_macos "$OS_MACOS" \
            '{python_versions: $python_versions, python_versions_standard: $python_versions_standard, os_matrix: $os_matrix, os_macos: $os_macos}')
          echo "test_matrix=$test_matrix" >> "$GITHUB_OUTPUT"

      - name: Display test matrix
        env:
          JSON_CONTENT: ${{ steps.build-matrix.outputs.test_matrix }}
        run: |
          echo "🧪 Test matrix loaded successfully:"
          echo "$JSON_CONTENT" | jq '.'
