# Main CI workflow that orchestrates all quality checks and tests.
# Runs on pull requests, pushes to main, a nightly schedule, and manual dispatch.
# Validates code quality, runs tests, and checks dependencies.
# The benchmark suite runs separately, on its own schedule, in ci-benchmark.yaml.
# Coverage is uploaded from the "all" job of ci-test.yaml rather than a
# separate full test run.
#
# The individual check jobs below call out to per-check reusable workflows
# (ci-build.yaml, ci-format.yaml, ...) instead of inlining their steps here,
# so each check can still be run/tested on its own (workflow_dispatch) and to
# keep this file short. Job ids are load-bearing: main's branch protection
# requires status checks named "format / format", "pre-commit / pre-commit"
# and "type-checking / type-checking", derived from the job id here plus the
# job id in the called workflow - keep both in sync if either is renamed.

name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC to catch issues from external changes
  workflow_dispatch: # to trigger manually

# Serialize runs for the same PR/branch instead of letting them queue in
# arbitrary order; cancel-in-progress is intentionally false so an
# in-progress run always finishes rather than being cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Load the shared python-version/OS matrix from dev/config/test_matrix.json
  # once, and pass it down to every job below that needs it.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  # Validate package can be built and installed correctly
  build:
    needs: get-matrix
    uses: ./.github/workflows/ci-build.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  # Check for circular import dependencies
  cyclic-imports:
    uses: ./.github/workflows/ci-cyclic-imports.yaml

  # Run doctests on code examples
  doctest:
    uses: ./.github/workflows/ci-doctest.yaml
    secrets: inherit

  # Verify code formatting and linting
  format:
    uses: ./.github/workflows/ci-format.yaml

  # Check type annotations with pyright
  type-checking:
    uses: ./.github/workflows/ci-type-checking.yaml

  # Run pre-commit hooks for code quality
  pre-commit:
    uses: ./.github/workflows/ci-pre-commit.yaml

  # Run unit and integration tests across multiple Python versions and OS.
  # secrets: inherit is required so the "all" job can upload coverage to Codecov.
  test:
    needs: get-matrix
    uses: ./.github/workflows/ci-test.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    secrets: inherit

  # Test compatibility with different dependency versions
  test-deps:
    needs: get-matrix
    uses: ./.github/workflows/ci-test-deps.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
