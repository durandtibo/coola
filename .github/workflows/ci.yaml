# Main CI workflow that orchestrates all quality checks and tests.
# Runs on pull requests and pushes to the main branch.
# Validates code quality, runs tests, and checks dependencies.
# Coverage is uploaded from the "all" job of ci-test.yaml (called via ci-checks.yaml)
# rather than a separate full test run.

name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Shared build/lint/test checks, also used by nightly-tests.yaml
  checks:
    uses: ./.github/workflows/ci-checks.yaml
    secrets: inherit
