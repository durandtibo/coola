# Main CI workflow that orchestrates all quality checks and tests.
# Runs on pull requests, pushes to main, a nightly schedule, and manual dispatch.
# It tests every module (*.mk) of the repository against the files of testdata/.
#
# Deliberately NOT called from here, with its own trigger:
#   - ci-verify-workflows.yaml: lints .github/workflows/* itself.
#
# Permissions are set at the job level, not the workflow level.
#
# The individual check jobs below call out to per-module reusable workflows
# (ci-yaml.yaml, ...) instead of inlining their steps here, so each check
# is easy to read and to extend.

name: CI
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC to catch issues from external changes
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Load the shared OS and Python version matrices from the default config of
  # durandtibo/workflow-config-action once, and pass it down to every job
  # below that needs it.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  # Verify the formatting and lint all the files of the repository
  format:
    uses: ./.github/workflows/ci-format.yaml
    permissions:
      contents: read

  # Test yaml.mk on multiple OS
  yaml:
    needs: get-matrix
    uses: ./.github/workflows/ci-yaml.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  # Test makefile.mk on multiple OS
  makefile:
    needs: get-matrix
    uses: ./.github/workflows/ci-makefile.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  # Test shell.mk on multiple OS
  shell:
    needs: get-matrix
    uses: ./.github/workflows/ci-shell.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  # Test toml.mk on multiple OS
  toml:
    needs: get-matrix
    uses: ./.github/workflows/ci-toml.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  # Test markdown.mk on multiple OS
  markdown:
    needs: get-matrix
    uses: ./.github/workflows/ci-markdown.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  # Test actions.mk on multiple OS
  actions:
    needs: get-matrix
    uses: ./.github/workflows/ci-actions.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  # Test github.mk on multiple OS
  github:
    needs: get-matrix
    uses: ./.github/workflows/ci-github.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  # Test self.mk on multiple OS
  self:
    needs: get-matrix
    uses: ./.github/workflows/ci-self.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  # Test git.mk on multiple OS
  git:
    needs: get-matrix
    uses: ./.github/workflows/ci-git.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  # Test tools.mk on multiple OS
  tools:
    needs: get-matrix
    uses: ./.github/workflows/ci-tools.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  # Test uv.mk on multiple OS and Python versions
  uv:
    needs: get-matrix
    uses: ./.github/workflows/ci-uv.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read
