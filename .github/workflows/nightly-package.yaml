name: Nightly Package Tests
on:
  schedule:
    - cron: "30 10 * * *" # run at 10:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Get the extra names from pyproject.toml, and their version bounds from
  # dev/config/package_versions.json.
  get-extras:
    uses: ./.github/workflows/get-package-extras.yaml
  get-versions:
    uses: ./.github/workflows/get-versions.yaml

  stable:
    uses: ./.github/workflows/test-package.yaml
    with:
      install-cmd: "uv pip install coola"

  stable-all:
    uses: ./.github/workflows/test-package.yaml
    with:
      install-cmd: 'uv pip install "coola[all]"'

  stable-extras:
    uses: ./.github/workflows/test-package-extras.yaml

  latest:
    uses: ./.github/workflows/test-package.yaml
    with:
      install-cmd: "uv pip install --pre coola"

  latest-all:
    uses: ./.github/workflows/test-package.yaml
    with:
      install-cmd: 'uv pip install --pre "coola[all]"'

  latest-extras:
    uses: ./.github/workflows/test-package-extras.yaml
    with:
      install-args: "--pre"

  #################################
  #     Optional dependencies     #
  #################################

  # One job per optional dependency, driven by get-extras/get-versions
  # instead of a hardcoded list, so a new optional dependency only needs to
  # be added to pyproject.toml (and dev/config/package_versions.json, kept up
  # to date by generate-package-versions.yaml).
  test-dep:
    needs: [get-extras, get-versions]
    strategy:
      fail-fast: false
      matrix:
        package-name: ${{ fromJson(needs.get-extras.outputs.extras) }}
    uses: ./.github/workflows/test-package-dep.yaml
    with:
      package-name: ${{ matrix.package-name }}
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions)[matrix.package-name]) }}
