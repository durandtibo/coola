name: Nightly Package Tests
on:
  schedule:
    - cron: "30 10 * * *" # run at 10:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Get the extra names from pyproject.toml, and their version bounds from
  # dev/config/package_versions.json.
  get-deps:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-package-deps.yaml
  # Load the shared python-version/OS matrix from the default config of
  # durandtibo/workflow-config-action
  # once, and pass it down to every job below that needs it.
  get-matrix:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  stable:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install coola"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  stable-all:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: 'uv pip install "coola[all]"' # "all" installs everything
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  stable-extras:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package-extras.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install --pre coola"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest-all:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: 'uv pip install --pre "coola[all]"' # "all" installs everything
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest-extras:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package-extras.yaml
    with:
      install-args: "--pre"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  #################################
  #     Optional dependencies     #
  #################################

  # One job per optional dependency, driven by get-deps instead of a
  # hardcoded list, so a new optional dependency only needs to be added to
  # pyproject.toml (and dev/config/package_versions.json, kept up to date by
  # bot-generate-package-versions.yaml).
  test-dep:
    permissions:
      contents: read
    needs: [get-deps, get-matrix]
    strategy:
      fail-fast: false
      matrix:
        package-name: ${{ fromJson(needs.get-deps.outputs.extras) }}
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: ${{ matrix.package-name }}
      package-versions: ${{ toJson(fromJson(needs.get-deps.outputs.package_versions)[matrix.package-name]) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
