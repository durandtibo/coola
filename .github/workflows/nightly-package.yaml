name: Nightly Package Tests
on:
  schedule:
    - cron: "30 10 * * *" # run at 10:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Get the extra names from pyproject.toml, and their version bounds from
  # dev/config/package_versions.json.
  get-extras:
    uses: ./.github/workflows/lib-get-package-extras.yaml
  get-versions:
    uses: ./.github/workflows/lib-get-package-versions.yaml
  # Load the shared python-version/OS matrix from dev/config/test_matrix.json
  # once, and pass it down to every job below that needs it.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  stable:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install coola"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  stable-all:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: 'uv pip install "coola[all]"'
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  stable-extras:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package-extras.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: "uv pip install --pre coola"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest-all:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package.yaml
    with:
      install-cmd: 'uv pip install --pre "coola[all]"'
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  latest-extras:
    needs: get-matrix
    uses: ./.github/workflows/nightly-test-package-extras.yaml
    with:
      install-args: "--pre"
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  #################################
  #     Optional dependencies     #
  #################################

  # One job per optional dependency, driven by get-extras/get-versions
  # instead of a hardcoded list, so a new optional dependency only needs to
  # be added to pyproject.toml (and dev/config/package_versions.json, kept up
  # to date by generate-package-versions.yaml).
  test-dep:
    needs: [get-extras, get-versions, get-matrix]
    strategy:
      fail-fast: false
      matrix:
        package-name: ${{ fromJson(needs.get-extras.outputs.extras) }}
    uses: ./.github/workflows/nightly-test-package-dep.yaml
    with:
      package-name: ${{ matrix.package-name }}
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions)[matrix.package-name]) }}
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
