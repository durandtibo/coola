name: Test Package with Extras
on:
  workflow_call:
    inputs:
      install-args:
        default: ""
        description: "Optional arguments to install the package"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Load the shared python-version matrix from dev/config/test_matrix.json
  get-matrix:
    uses: ./.github/workflows/get-test-matrix.yaml

  test:
    needs: get-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: ${{ fromJson(needs.get-matrix.outputs.test_matrix).python_versions }}
        extra: [
          'all',
          'colorlog',
          'jax',
          'numpy',
          'packaging',
          'pandas',
          'polars',
          'pyarrow',
          'pydantic',
          'rich',
          'torch',
          'xarray',
        ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # ratchet:astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install package
        run: |
          uv pip install ${{ inputs.install-args }} "coola[${{ matrix.extra }}]"
      - name: Show dependency tree
        run: |

          uv pip tree --show-version-specifiers
      - name: Run some checks
        run: |

          python tests/package_checks.py
