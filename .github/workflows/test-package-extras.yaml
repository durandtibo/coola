name: Test Package with Extras
on:
  workflow_call:
    inputs:
      install-args:
        default: ""
        description: "Optional arguments to install the package"
        required: false
        type: string
      test-matrix:
        description: "JSON test matrix from get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Load the extras from pyproject.toml's [project.optional-dependencies],
  # plus "all" to also test installing every extra at once.
  get-extras:
    uses: ./.github/workflows/get-package-extras.yaml
    with:
      extra-values: '["all"]'

  test:
    needs: get-extras
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
        extra: ${{ fromJson(needs.get-extras.outputs.extras) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # ratchet:astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install package
        env:
          INSTALL_ARGS: ${{ inputs.install-args }}
          EXTRA: ${{ matrix.extra }}
        run: |
          read -ra install_args <<< "$INSTALL_ARGS"
          uv pip install "${install_args[@]}" "coola[$EXTRA]"
      - name: Show dependency tree
        run: |

          uv pip tree --show-version-specifiers
      - name: Run some checks
        run: |

          python tests/package_checks.py
