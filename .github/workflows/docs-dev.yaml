# Development documentation deployment workflow.
# Builds and deploys documentation for the development version to GitHub Pages.
# Triggered on every push to main branch to keep dev docs up to date.

name: Documentation (unstable)
on:
  workflow_call:
  workflow_dispatch: # to trigger manually
  push:
    branches:
      - main # Trigger on pushes to main branch

permissions: {}

# Serialize deploys to gh-pages to avoid racing mike deployments.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Required to push to gh-pages branch

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Install dependencies including documentation tools
      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@59716ab8fb83cc7025548b3831c06b6f5c268f4f # ratchet:durandtibo/setup-venv-uv-action@v0.1.0
        with:
          install-args: "--docs-deps"

      # Configure git and fetch gh-pages branch for mike
      - name: Setup doc deploy
        uses: ./.github/actions/setup-doc-deploy
        with:
          ci-bot-email: ${{ secrets.CI_BOT_EMAIL }}

      # Build and deploy documentation for the development version
      - name: Build and deploy documentation
        run: |
          inv publish-doc-dev
