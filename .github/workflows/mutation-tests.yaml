# Mutation testing workflow.
# Runs mutmut against the unit test suite to check that tests fail when the
# source code is mutated, not just that lines are covered. This is slower
# than the regular test suite, so it runs on a schedule instead of per-push.
# Failures are reported but do not block other workflows.

name: Mutation Tests
on:
  schedule:
    - cron: '30 9 * * 0' # Run at 9:30 AM UTC every Sunday
  workflow_dispatch:  # to trigger manually

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@v0.0.5

      - name: Run mutation testing
        run: |
          inv mutation-test

      - name: Show mutation testing results
        if: always()
        run: |
          mutmut results
