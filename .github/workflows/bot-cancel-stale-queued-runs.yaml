# Cancel Stale Queued Runs
#
# This workflow automatically cancels stale queued workflow runs to prevent
# resource waste and reduce queue congestion. It helps maintain a clean and
# efficient CI/CD environment by cleaning up abandoned runs.
#
# Schedule:
#   - Runs hourly (every hour at minute 0)
#   - Can also be triggered manually via workflow_dispatch
#
# Configuration:
#   - Uses GitHub token for authentication
#   - Operates on the current repository
#   - Age threshold `max_age_hours`: 24 by default (also for scheduled runs),
#     can be overridden in the GitHub web UI when run manually
#   - Number of runs to keep `max_runs`: 0 (no limit) by default, can be
#     overridden in the GitHub web UI when run manually
#
# Uses:
#   - durandtibo/cancel-queued-runs-action@v1.9
#     Specialized action for managing workflow run queue
#
# Purpose:
#   - Resource optimization: Prevents wasted compute on stale runs
#   - Queue management: Keeps workflow queue clean and responsive
#   - Cost reduction: Reduces unnecessary workflow execution time
#
# Permissions:
#   - actions: write - Required to cancel workflow runs
#   - contents: read - Required for repository access

name: Cancel Stale Queued Runs

on:
  schedule:
    - cron: "0 * * * *" # runs every hour
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Cancel queued runs older than this many hours"
        required: false
        default: "24"
        type: string
      max_runs:
        description: "Keep only this many most recent queued runs (0 means no limit)"
        required: false
        default: "0"
        type: string

permissions: {}

jobs:
  cancel-stale-runs:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      - uses: durandtibo/cancel-queued-runs-action@3f57ce49d16e0e14e7dd4aed984ff77470d8e357 # ratchet:durandtibo/cancel-queued-runs-action@v1.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          # Scheduled runs have no inputs, so fall back to 24 hours.
          max_age_hours: ${{ inputs.max_age_hours || '24' }}
          # No limit (0) for scheduled runs, which have no inputs.
          max_runs: ${{ inputs.max_runs || '0' }}
