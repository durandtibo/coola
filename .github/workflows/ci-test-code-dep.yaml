# Reusable workflow for testing code with specific dependency versions.
# Used by ci-test-deps.yaml to test compatibility with different versions of dependencies.
# Runs unit tests with each specified version of a package.

name: Test Code with Dependency Version
on:
  workflow_call:
    inputs:
      package-name:
        type: string
        required: true
      package-versions:
        type: string
        required: true
      test-matrix:
        description: "JSON test matrix from get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        # Test across all supported Python versions
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
        # Test with each version of the specified package
        package-version: ${{ fromJson(inputs.package-versions) }}

    steps:
      # Install specific version of dependency for compatibility testing
      - name: Checkout and setup python environment
        uses: ./.github/actions/checkout-python-env
        with:
          package-name: ${{ inputs.package-name }}
          package-version: ${{ matrix.package-version }}
          python-version: ${{ matrix.python-version }}
          install-args: "--no-optional-deps"
          package-install-args: "--upgrade"

      # Run unit tests to verify compatibility
      - name: Run unit tests
        run: |
          inv unit-test
