# Benchmark workflow.
# Runs the performance benchmark suite (tests/benchmarks/) to catch
# regressions in the equality comparison machinery. Not part of the
# blocking PR checks.

name: Benchmark
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@59716ab8fb83cc7025548b3831c06b6f5c268f4f # ratchet:durandtibo/setup-venv-uv-action@v0.1.0

      - name: Run benchmarks
        run: |
          inv benchmark
