# Benchmark workflow.
# Runs the performance benchmark suite (tests/benchmarks/) to catch
# regressions in the equality comparison machinery. Not part of the
# blocking PR checks: runs nightly on its own schedule instead of on every
# PR/push, and can also be triggered manually.

name: Benchmark
on:
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC, alongside CI's nightly run
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout and setup python environment
        uses: ./.github/actions/checkout-python-env

      - name: Run benchmarks
        run: |
          inv benchmark
