# Benchmark workflow.
# Runs the performance benchmark suite (tests/benchmarks/) to catch
# regressions in the equality comparison machinery. Not part of the
# blocking PR checks: runs nightly on its own schedule instead of on every
# PR/push, and can also be triggered manually.

name: Benchmark
on:
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC, alongside CI's nightly run
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0

      - name: Run benchmarks
        run: |
          inv test.benchmark
