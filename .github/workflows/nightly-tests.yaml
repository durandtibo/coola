# Nightly test workflow.
# Runs the full CI test suite every night to catch issues early.
# Helps detect problems with dependencies or external changes.

name: Nightly Tests
on:
  schedule:
    - cron: "10 9 * * *" # Run at 9:10 AM UTC daily
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Same build/lint/test checks that run in ci.yaml, kept in sync via checks.yaml
  checks:
    uses: ./.github/workflows/checks.yaml
    secrets: inherit

  benchmark:
    uses: ./.github/workflows/benchmark.yaml
