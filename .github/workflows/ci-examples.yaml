# Examples workflow.
# Runs the tests of the examples (tests/examples/) to check that the scripts
# of examples/ still work. Not part of the blocking PR checks: runs daily on
# its own schedule instead of on every PR/push, and can also be triggered
# manually.

name: Examples
on:
  schedule:
    - cron: "20 9 * * *" # Run daily at 9:20 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  examples:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@4445098aa662d3d72aa0455918bc46a091b2a7f8 # ratchet:durandtibo/setup-venv-uv-action@v0.3.1
        with:
          python-version: "3.14"

      - name: Run the examples tests
        run: |
          python -m pytest tests/examples/ -v
