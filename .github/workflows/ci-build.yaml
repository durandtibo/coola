# Build and package validation workflow.
# Tests that the package can be built correctly as both source distribution and wheel.
# Validates package metadata, dependencies, and that the package is properly typed.

name: Build Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Load the extras from pyproject.toml's [project.optional-dependencies],
  # plus "" for a baseline "no extra" build.
  get-extras:
    uses: ./.github/workflows/lib-get-package-extras.yaml
    with:
      extra-values: '[""]'

  # Default Python version x every extra (incl. no-extra baseline): catches
  # per-extra build/packaging issues. Kept separate from build-all below,
  # which instead varies Python version at a fixed extra=all - merging the
  # two into one matrix would need an `include:` fan-out plus conditional
  # steps for little gain, since the two jobs vary orthogonal axes.
  build:
    needs: get-extras
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        dist-type: ["sdist", "wheel"]
        package-extra: ${{ fromJson(needs.get-extras.outputs.extras) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Verify Build
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: coola
          package-extra: ${{ matrix.package-extra }}
          package-dependencies: ""
          dist-type: ${{ matrix.dist-type }}
      - name: Run package checks
        shell: bash
        run: |

          set -euo pipefail
          echo "🔍 Running package checks..."
          python tests/package_checks.py

          echo "✅ Package checks passed"
      - name: Check optional packages installation
        if: ${{ matrix.package-extra != '' }}
        shell: bash
        env:
          PACKAGE_EXTRA: ${{ matrix.package-extra }}
        run: |
          set -euo pipefail
          echo "🔍 Verifying if $PACKAGE_EXTRA is installed..."

          if ! uv pip list | grep -qE "^${PACKAGE_EXTRA}\s"; then
            echo "❌ Error: Package '$PACKAGE_EXTRA' not found in installed packages"
            echo "Installed packages:"
            uv pip list
            exit 1
          fi
          echo "✅ Package '$PACKAGE_EXTRA' is installed"

  build-all:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        dist-type: ["sdist", "wheel"]
        # Test at least one full-extras build per supported Python version to
        # catch version-specific build regressions (e.g. free-threaded 3.13t/3.14t).
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # ratchet:astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Verify Build
        uses: durandtibo/verify-uv-build-action@88da014d506b5f0b4f657d4ba8920061ab785620 # ratchet:durandtibo/verify-uv-build-action@v0.0.7
        with:
          package-name: coola
          package-extra: all
          package-dependencies: ""
          dist-type: ${{ matrix.dist-type }}
          verify-sdist-extra: false
      - name: Run package checks
        run: |

          set -euo pipefail
          echo "🔍 Running package checks..."
          python tests/package_checks.py

          echo "✅ Package checks passed"
