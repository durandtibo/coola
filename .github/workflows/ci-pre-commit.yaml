# Pre-commit hooks validation workflow.
# Runs all configured pre-commit hooks to validate code quality.
# Checks formatting, linting, and other code quality rules.

name: Pre-commit
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Run pre-commit hooks to validate code quality
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Set up uv/Python (pre-commit action will install hooks automatically)
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # ratchet:astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      # Run all pre-commit hooks on changed files
      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # ratchet:pre-commit/action@v3.0.1
