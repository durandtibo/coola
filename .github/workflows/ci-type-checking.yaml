# Type checking workflow.
# Validates type annotations using pyright to ensure type safety.
# Helps catch type-related bugs before runtime.

name: Type Checking
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  type-checking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout and setup python environment
        uses: ./.github/actions/checkout-python-env

      - name: Check types
        run: |
          inv check-types
