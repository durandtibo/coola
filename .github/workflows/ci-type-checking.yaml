# Type checking workflow.
# Validates type annotations using ty and pyright to ensure type safety.
# Helps catch type-related bugs before runtime.

name: Type Checking
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  type-checking:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@6142e28631bebf642f8ff7087c8c8702f5d99c63 # ratchet:durandtibo/setup-venv-uv-action@v0.3.2
        with:
          install-args: "--groups dev,docs,property"

      # Type-check the source code and the tests with ty and pyright
      - name: Check types
        run: |
          inv types.check --complete
