# Comprehensive test suite workflow.
# Runs unit and integration tests across multiple Python versions and operating systems.
# Tests both with all dependencies and with minimal dependencies.

name: Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from get-test-matrix.yaml. If omitted (e.g. manual workflow_dispatch), it is loaded internally."
        required: false
        type: string
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Load the shared python-version/OS matrix from dev/config/test_matrix.json,
  # but only when the caller didn't already load it once and pass it in.
  get-matrix:
    if: inputs.test-matrix == ''
    uses: ./.github/workflows/get-test-matrix.yaml

  # Test with all dependencies across multiple Python versions and operating systems
  all:
    needs: get-matrix
    # get-matrix is skipped whenever the caller already passed test-matrix in;
    # a skipped need isn't "success", so allow that result explicitly.
    if: needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_matrix }}
        # Test all supported Python versions including free-threaded builds (t suffix)
        python-version: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).python_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@59716ab8fb83cc7025548b3831c06b6f5c268f4f # ratchet:durandtibo/setup-venv-uv-action@v0.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: |
          inv unit-test --cov
      - name: Run integration tests
        run: |
          inv integration-test --cov

  # Test with minimal dependencies to ensure optional dependencies are truly optional
  min:
    needs: get-matrix
    if: needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix || needs.get-matrix.outputs.test_matrix).python_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      # Install only required dependencies, not optional ones
      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@59716ab8fb83cc7025548b3831c06b6f5c268f4f # ratchet:durandtibo/setup-venv-uv-action@v0.1.0
        with:
          python-version: ${{ matrix.python-version }}
          install-args: "--no-optional-deps"
      - name: Run unit tests
        run: |
          inv unit-test --cov
      - name: Run integration tests
        run: |
          inv integration-test --cov
