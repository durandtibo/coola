# PyPI package publishing workflow.
# Builds and publishes the package to PyPI when a new version is released.
# Triggered by version tags or can be run manually.

name: Publish PyPI Package
on:
  workflow_dispatch: # Allow manual trigger
  push:
    tags:
      - "v*.*.*" # Trigger on version tags (e.g., v1.0.0)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Manual runs are only allowed from main; tag pushes are always allowed.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Install uv package manager
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # ratchet:astral-sh/setup-uv@v10.1.0
        with:
          activate-environment: true

      # Install invoke task runner
      - name: Install invoke
        run: |
          make install-invoke

      - name: Build package
        run: |
          inv release.build

      - name: Check package metadata
        run: |
          uvx twine check --strict dist/*

      - name: Extract package metadata
        id: metadata
        uses: durandtibo/extract-pyproject-metadata-action@4661b78698e6ceb7e04cf60bbdd52addf85a2889 # ratchet:durandtibo/extract-pyproject-metadata-action@v0.2

      - name: Check manual run uses a dev/pre-release version
        if: github.event_name == 'workflow_dispatch'
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          # Manual runs must never publish a plain release version
          # (e.g. "1.2.3"); only pre-release/dev versions
          # (e.g. "1.2.3a1", "1.2.3.dev1") are allowed. Real releases
          # must go through a "vX.Y.Z" tag push instead.
          if [[ "${PACKAGE_VERSION}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Manual runs require a dev/pre-release version, got plain release version ${PACKAGE_VERSION}"
            exit 1
          fi

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_VERSION: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          # Tag is "vX.Y.Z"; strip the leading "v" before comparing.
          if [[ "${TAG_VERSION#v}" != "${PACKAGE_VERSION}" ]]; then
            echo "::error::Tag ${TAG_VERSION} does not match package version ${PACKAGE_VERSION}"
            exit 1
          fi

      - name: Check version not already published on PyPI
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/${PACKAGE_NAME}/${PACKAGE_VERSION}/json")
          if [[ "$status" == "200" ]]; then
            echo "::error::${PACKAGE_NAME} ${PACKAGE_VERSION} is already published on PyPI"
            exit 1
          fi

      - name: Smoke test built wheel
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
        run: |
          uv venv smoke-test-venv
          source smoke-test-venv/bin/activate
          uv pip install dist/*.whl
          python -c "import importlib; importlib.import_module('${PACKAGE_NAME}')"
          deactivate

      - name: Generate checksums
        run: |
          cd dist && sha256sum -- *.tar.gz *.whl > SHA256SUMS

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 5

  sign-and-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Required to sign artifacts with Sigstore using OIDC keyless signing.
      id-token: write
      # Required to attach the artifacts and signatures to the GitHub release.
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Verify checksums
        run: |
          cd dist && sha256sum --check SHA256SUMS

      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # ratchet:sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: dist/*.tar.gz dist/*.whl

      - name: Upload signature bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: signatures
          path: dist/*.sigstore.json
          retention-days: 5

      - name: Upload artifacts and signatures to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # ratchet:softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/*.sigstore.json
            dist/SHA256SUMS

  publish:
    needs: [build, sign-and-release]
    # Only fail-closed on tag pushes: on a tag, publish must wait for
    # sign-and-release to succeed; on workflow_dispatch, sign-and-release
    # is skipped (not failed), so allow publish to proceed.
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.sign-and-release.result == 'success' || needs.sign-and-release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/coola/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) - no API token needed.
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Verify checksums
        run: |
          cd dist && sha256sum --check SHA256SUMS && rm SHA256SUMS

      - name: Download signature bundles
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: signatures
          path: dist/

      - name: Verify Sigstore signatures
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uvx sigstore verify identity dist/*.tar.gz dist/*.whl \
            --cert-identity "https://github.com/${{ github.repository }}/.github/workflows/release-pypi.yaml@${{ github.ref }}" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # ratchet:pypa/gh-action-pypi-publish@v1.14.2
