# Automated dependency update workflow.
# Updates all dependencies to their latest compatible versions weekly.
# Creates a pull request with the updates after running tests.

name: Update Dependencies
on:
  schedule:
    - cron: "0 6 * * 6" # Run every Saturday at 6:00 AM UTC
  workflow_dispatch: # to trigger manually

# Prevent an overlapping scheduled + manually-dispatched run from racing to
# open the same update PR.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  update-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # actions/checkout only needs read; the app token grants write

    steps:
      - name: Bot checkout
        id: bot-checkout
        uses: ./.github/actions/bot-checkout
        with:
          client-id: ${{ secrets.TIBOT_CLIENT_ID }}
          private-key: ${{ secrets.TIBOT_APP_PRIVATE_KEY }}

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@59716ab8fb83cc7025548b3831c06b6f5c268f4f # ratchet:durandtibo/setup-venv-uv-action@v0.1.0

      # Update all dependencies to their latest compatible versions
      - name: Update dependencies
        run: |
          inv update

      # Install dependencies including documentation dependencies
      - name: Install dependencies with docs
        run: |
          inv install --docs-deps

      # Display updated dependency tree
      - name: Show dependency tree
        shell: bash
        run: |
          uv pip tree --show-version-specifiers

      # Run tests to ensure updates don't break functionality
      - name: Run unit tests
        run: |
          inv unit-test --cov

      # Create a pull request with the dependency updates
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # ratchet:peter-evans/create-pull-request@v8
        if: always()
        with:
          token: ${{ steps.bot-checkout.outputs.token }}
          branch: update/dependencies
          title: Update dependencies
          commit-message: "Update dependencies"
          body: Update dependencies to latest compatible version.
          author: ci-bot <${{secrets.CI_BOT_EMAIL}}>
