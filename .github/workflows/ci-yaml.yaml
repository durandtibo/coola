# YAML module workflow.
# Tests the targets of yaml.mk against the files of testdata/ on multiple operating systems.

name: Test yaml.mk
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: lint-yaml (installs yamllint on demand)
        run: make -f yaml.mk lint-yaml YAML_LINT_PATH=testdata/sample.yaml

      - name: format-yaml (installs prettier on demand)
        run: make -f yaml.mk format-yaml YAML_FORMAT_PATH=testdata/sample.yaml

      - name: format-yaml (no matching files)
        run: make -f yaml.mk format-yaml YAML_FORMAT_PATH="testdata/no-such-dir/*.yaml"
