# Code formatting and linting workflow.
# Checks code formatting and code quality with ruff.
# Ensures code follows project style guidelines.

name: Format
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0

      - name: Check python formatting
        run: |
          inv format.check-python

      - name: Lint python scripts
        run: |
          inv lint.check-python

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # make lint-shell/check-format-shell use `xargs -r`, so they no-op
      # cleanly when the repo has no shell scripts, unlike the previous
      # ludeeus/action-shellcheck-based setup which failed with "No files
      # specified" in that case.
      - name: Check shell formatting
        run: |
          make check-format-shell

      - name: Lint shell scripts
        run: |
          make lint-shell
