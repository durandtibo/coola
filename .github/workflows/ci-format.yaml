# Code formatting and linting workflow.
# Checks code formatting with black and code quality with ruff.
# Ensures code follows project style guidelines.

name: Format
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout and setup python environment
        uses: ./.github/actions/checkout-python-env

      # Check code formatting with black
      - name: Check format
        run: |
          inv check-format

      # Check code quality with ruff
      - name: Check lint
        run: |
          inv check-lint

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Installs and runs ShellCheck in one step. `version: stable` always
      # resolves to the latest stable ShellCheck release at run time, and the
      # action reference itself is kept current by dependabot.yml (github-actions
      # ecosystem) + the bot-pin-action.yaml ratchet job — so no version to bump by hand.
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # ratchet:ludeeus/action-shellcheck@2.0.0
        with:
          version: stable
          check_together: "yes"

      # setup-shfmt defaults shfmt-version to `latest`, so it also auto-updates;
      # the action reference is kept current the same way as ShellCheck above.
      - name: Install shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # ratchet:mfinelli/setup-shfmt@v4.0.1

      - name: Run shfmt
        run: |
          shopt -s globstar
          echo "✨ Checking formatting using shfmt..."
          shfmt -d -- **/*.sh
