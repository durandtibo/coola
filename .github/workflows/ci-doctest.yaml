# Documentation testing workflow.
# Runs doctests on code examples in docstrings to ensure they work correctly.
# Also validates that the documentation can be built without errors.

name: Doctest
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Run doctests embedded in source code docstrings
  doctest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout and setup python environment
        uses: ./.github/actions/checkout-python-env

      # Run doctest to validate code examples in docstrings
      - name: Run doctest on source code
        run: |
          inv doctest-src

  # Verify documentation can be built without errors
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Install dependencies including documentation tools (mkdocs, mike, etc.)
      - name: Checkout and setup python environment
        uses: ./.github/actions/checkout-python-env
        with:
          install-args: "--docs-deps"

      # Configure git for mike (documentation versioning tool), shared with
      # release-docs-publish.yaml so the two never drift.
      - name: Setup doc deploy
        uses: ./.github/actions/setup-doc-deploy
        with:
          ci-bot-email: ${{ secrets.CI_BOT_EMAIL }}

      # Build documentation to a temporary branch to verify no errors
      - name: Build documentation
        run: |
          mike deploy --config-file docs/mkdocs.yml --branch tmp-doc-build-1234 dev
