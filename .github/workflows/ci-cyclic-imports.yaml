# Cyclic imports check.
# Imports every coola subpackage in isolation to catch circular-import
# regressions that only surface once a submodule is imported directly.

name: Cyclic Imports
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  cyclic-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0

      - name: check modules
        run: |
          # Discover all coola subpackages dynamically instead of a hand-maintained
          # list, so newly added subpackages are automatically covered.
          modules=$(python -c "
          import pkgutil
          import coola
          names = ['coola'] + sorted(
              name for _, name, ispkg in pkgutil.walk_packages(coola.__path__, prefix='coola.')
              if ispkg
          )
          print('\n'.join(names))
          ")
          echo "$modules" | while IFS= read -r module; do
            echo "::group::check ${module}"
            python -c "import ${module}"
            echo "::endgroup::"
          done
