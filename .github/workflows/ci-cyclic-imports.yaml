name: Cyclic Imports
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  cyclic-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout and setup python environment
        uses: ./.github/actions/checkout-python-env

      - name: check modules
        run: |
          # Discover all coola subpackages dynamically instead of a hand-maintained
          # list, so newly added subpackages are automatically covered.
          modules=$(python -c "
          import pkgutil
          import coola
          names = ['coola'] + sorted(
              name for _, name, ispkg in pkgutil.walk_packages(coola.__path__, prefix='coola.')
              if ispkg
          )
          print('\n'.join(names))
          ")
          echo "$modules" | while IFS= read -r module; do
            echo "::group::check ${module}"
            python -c "import ${module}"
            echo "::endgroup::"
          done
