# Comprehensive test suite workflow.
# Runs unit and integration tests across multiple Python versions and operating systems.
# Tests both with all dependencies and with minimal dependencies.
# The ubuntu-latest/3.14 cell of the "all" matrix also uploads coverage to Codecov,
# so coverage tracking rides on an existing run instead of a separate full test pass.

name: Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Test with all dependencies across multiple Python versions and operating systems
  all:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        # Test all supported Python versions including free-threaded builds (t suffix)
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@59716ab8fb83cc7025548b3831c06b6f5c268f4f # ratchet:durandtibo/setup-venv-uv-action@v0.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: |
          inv unit-test --cov
      - name: Run integration tests
        run: |
          inv integration-test --cov
      # Upload coverage from a single representative cell of the matrix (only
      # for the main repository, to avoid spam from forks).
      - name: Upload coverage to Codecov
        if: |
          matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' &&
          github.repository == 'durandtibo/coola' && (github.event_name == 'push' || github.event_name == 'pull_request')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # ratchet:codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          # Ignore codecov failures as the codecov server is not
          # very reliable but we don't want to report a failure
          # in the github UI just because the coverage report failed to
          # be published.
          fail_ci_if_error: false

  # Test with minimal dependencies to ensure optional dependencies are truly optional
  min:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      # Install only required dependencies, not optional ones
      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@59716ab8fb83cc7025548b3831c06b6f5c268f4f # ratchet:durandtibo/setup-venv-uv-action@v0.1.0
        with:
          python-version: ${{ matrix.python-version }}
          install-args: "--no-optional-deps"
      - name: Run unit tests
        run: |
          inv unit-test --cov
      - name: Run integration tests
        run: |
          inv integration-test --cov
