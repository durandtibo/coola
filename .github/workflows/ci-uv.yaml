# uv module workflow.
# Tests the targets of uv.mk on multiple operating systems and Python versions.
# The Python versions are the standard (non-threaded) ones of the shared config.

name: Test uv.mk
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions_standard }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Check the Python version
        env:
          EXPECTED_VERSION: ${{ matrix.python-version }}
        run: |
          python --version
          python --version | grep -F "Python $EXPECTED_VERSION"

      - name: install-invoke
        run: make -f uv.mk install-invoke

      - name: Check that invoke is installed
        run: uv pip show invoke

      - name: Check that invoke-tasklib is installed
        run: uv pip show invoke-tasklib

      - name: Check the invoke-tasklib version
        run: |
          uv pip show invoke-tasklib | grep -E '^Version: (0\.0\.([8-9]|[1-9][0-9])|0\.[1-9]|[1-9])'

      - name: Check that the env tasks are available
        run: |
          echo "from invoke_tasklib import ns" > tasks.py
          inv --list | grep -E 'env\.create-venv'
          inv --list | grep -E 'env\.install'

      - name: Check that the env tasks run through uv run
        run: |
          uv run inv --list | grep -E 'env\.create-venv'
          uv run inv --list | grep -E 'env\.install'
