# Pre-commit hooks validation workflow.
# Runs all configured pre-commit hooks to validate code quality.
# Checks formatting, linting, and other code quality rules.

name: pre-commit
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Run pre-commit hooks to validate code quality
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Set up Python (pre-commit action will install hooks automatically)
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.14"

      # Run all pre-commit hooks on changed files
      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # ratchet:pre-commit/action@v3.0.1
