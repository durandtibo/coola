# Pre-commit hooks auto-update workflow.
# Automatically updates pre-commit hook versions weekly.
# Creates a pull request with updated hook versions after validation.

name: Pre-commit Auto-update

on:
  schedule:
    - cron: "0 8 * * 2" # Run every Tuesday at 8:00 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # actions/checkout only needs read; the app token grants write
    steps:
      - name: Bot checkout
        id: bot-checkout
        uses: ./.github/actions/bot-checkout
        with:
          client-id: ${{ secrets.TIBOT_CLIENT_ID }}
          private-key: ${{ secrets.TIBOT_APP_PRIVATE_KEY }}

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@59716ab8fb83cc7025548b3831c06b6f5c268f4f # ratchet:durandtibo/setup-venv-uv-action@v0.1.0

      # Update pre-commit hooks to their latest versions
      - name: Autoupdate pre-commit hooks
        run: |
          pre-commit autoupdate

      # Run pre-commit on all files to test updated hooks
      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files

      # Create a pull request with the updates
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # ratchet:peter-evans/create-pull-request@v8
        if: always()
        with:
          token: ${{ steps.bot-checkout.outputs.token }}
          branch: update/pre-commit-hooks
          title: Update pre-commit hooks
          commit-message: "Update pre-commit hooks"
          body: Update versions of pre-commit hooks to latest version.
          author: ci-bot <${{secrets.CI_BOT_EMAIL}}>
