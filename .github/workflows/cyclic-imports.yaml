name: Cyclic Imports
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  cyclic-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@59716ab8fb83cc7025548b3831c06b6f5c268f4f # ratchet:durandtibo/setup-venv-uv-action@v0.1.0

      - name: check modules
        run: |
          modules=(
            coola
            coola.display
            coola.equality
            coola.equality.handler
            coola.equality.tester
            coola.factory
            coola.hashing
            coola.identifier
            coola.iterator
            coola.iterator.bfs
            coola.iterator.dfs
            coola.nested
            coola.random
            coola.recursive
            coola.reducer
            coola.registry
            coola.summary
            coola.testing
            coola.utils
          )
          for module in "${modules[@]}"; do
            echo "::group::check ${module}"
            python -c "import ${module}"
            echo "::endgroup::"
          done
