# Dependency compatibility testing workflow.
# Tests the package with different versions of optional dependencies.
# Ensures compatibility across supported dependency version ranges.

name: Dependency Compatibility (Source)
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Get the extra names from pyproject.toml, and their version bounds from
  # dev/config/package_versions.json.
  get-deps:
    uses: ./.github/workflows/lib-get-package-deps.yaml

  # One job per optional dependency, driven by get-deps instead of a
  # hardcoded list, so a new optional dependency only needs to be added to
  # pyproject.toml (and dev/config/package_versions.json, kept up to date by
  # bot-generate-package-versions.yaml).
  test-dep:
    needs: get-deps
    strategy:
      fail-fast: false
      matrix:
        package-name: ${{ fromJson(needs.get-deps.outputs.extras) }}
    uses: ./.github/workflows/ci-test-code-dep.yaml
    with:
      package-name: ${{ matrix.package-name }}
      package-versions: ${{ toJson(fromJson(needs.get-deps.outputs.package_versions)[matrix.package-name]) }}
      test-matrix: ${{ inputs.test-matrix }}
