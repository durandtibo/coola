# Reusable workflow for testing installed package with specific dependency versions.
# Tests the PyPI package with different versions of optional dependencies.
# Ensures published package works across supported dependency version ranges.

name: Dependency Compatibility (PyPI Package)
on:
  workflow_call:
    inputs:
      package-name:
        type: string
        required: true
      package-versions:
        type: string
        required: true
      test-matrix:
        description: "JSON test matrix from get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
        # Test with each version of the specified package
        package-version: ${{ fromJson(inputs.package-versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Install uv package manager
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # ratchet:astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      # Install the package from PyPI
      - name: Install package
        run: |
          uv pip install coola

      # Install specific version of dependency for compatibility testing
      - name: Install valid package version
        uses: durandtibo/uv-install-package-action@fe64eac38f69e851b5e79b74ee255ed95a159bc0 # ratchet:durandtibo/uv-install-package-action@v0.2.0
        with:
          package-name: ${{ inputs.package-name }}
          package-version: ${{ matrix.package-version }}
          python-version: ${{ matrix.python-version }}

      # Display dependency tree and run basic package checks
      - name: Verify installed package
        uses: ./.github/actions/verify-installed-package
