# Stable documentation deployment workflow.
# Builds and deploys documentation for released versions to GitHub Pages.
# Triggered by version tags and uses mike for documentation versioning.
# The actual build/deploy steps live in release-docs-publish.yaml, shared with release-docs-dev.yaml.

name: Documentation (stable)
on:
  workflow_dispatch: # to trigger manually
  push:
    tags:
      - "v*.*.*" # Trigger on version tags (e.g., v1.0.0)

# Serialize (never cancel) re-runs for the same tag, so a manual re-dispatch
# can't be cut off mid-publish; different tags get independent groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # Required by the called workflow to push to gh-pages branch

jobs:
  publish:
    uses: ./.github/workflows/release-docs-publish.yaml
    with:
      mode: stable
    secrets: inherit
