name: Tests
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC to catch issues from external changes
  workflow_dispatch: # to trigger manually

jobs:
  workflow-config:
    runs-on: ubuntu-slim
    outputs:
      os_unix: ${{ steps.config.outputs.os_unix }}
    steps:
      - id: config
        uses: durandtibo/workflow-config-action@8c406999ac8ac3cafe656c263759d8ddea3a4edb # ratchet:durandtibo/workflow-config-action@v0.2

  test-yaml-mk:
    needs: workflow-config
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.workflow-config.outputs.os_unix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: lint-yaml (installs yamllint on demand)
        run: make -f yaml.mk lint-yaml YAML_LINT_PATH=testdata/sample.yaml

      - name: format-yaml (installs prettier on demand)
        run: make -f yaml.mk format-yaml YAML_FORMAT_PATH=testdata/sample.yaml

      - name: format-yaml (no matching files)
        run: make -f yaml.mk format-yaml YAML_FORMAT_PATH="testdata/no-such-dir/*.yaml"

  test-makefile-mk:
    needs: workflow-config
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.workflow-config.outputs.os_unix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: lint-makefile (installs checkmake on demand)
        run: make -f makefile.mk lint-makefile MAKEFILE_LINT_FILES="yaml.mk makefile.mk shell.mk toml.mk markdown.mk"

      - name: format-makefile (installs mbake on demand)
        run: make -f makefile.mk format-makefile MAKEFILE_FORMAT_FILES="yaml.mk makefile.mk shell.mk toml.mk markdown.mk"

      - name: format-makefile (no matching files)
        run: make -f makefile.mk format-makefile MAKEFILE_FORMAT_FILES="no-such-dir/*.mk"

  test-shell-mk:
    needs: workflow-config
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.workflow-config.outputs.os_unix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: lint-shell (installs shellcheck on demand)
        run: make -f shell.mk lint-shell SHELL_LINT_PATH=testdata

      - name: format-shell (installs shfmt on demand)
        run: make -f shell.mk format-shell SHELL_FORMAT_PATH=testdata

      - name: format-shell (no matching files)
        run: make -f shell.mk format-shell SHELL_FORMAT_PATH=testdata/no-such-dir

      - name: check-format-shell (correctly formatted files)
        run: make -f shell.mk check-format-shell SHELL_FORMAT_PATH=testdata

      - name: check-format-shell (no matching files)
        run: make -f shell.mk check-format-shell SHELL_FORMAT_PATH=testdata/no-such-dir

      - name: install-bats
        run: make -f shell.mk install-bats

      - name: check bats is installed
        run: bats --version

      - name: install-bats (already installed)
        run: make -f shell.mk install-bats

  test-toml-mk:
    needs: workflow-config
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.workflow-config.outputs.os_unix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: format-toml (installs taplo on demand)
        run: make -f toml.mk format-toml TOML_FORMAT_PATH=testdata

      - name: format-toml (no matching files)
        run: make -f toml.mk format-toml TOML_FORMAT_PATH=testdata/no-such-dir

  test-markdown-mk:
    needs: workflow-config
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.workflow-config.outputs.os_unix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: lint-markdown (installs markdownlint on demand)
        run: make -f markdown.mk lint-markdown MARKDOWN_LINT_GLOB=testdata/sample.md

      - name: format-markdown (installs prettier on demand)
        run: make -f markdown.mk format-markdown MARKDOWN_FORMAT_PATH=testdata/sample.md

      - name: format-markdown (no matching files)
        run: make -f markdown.mk format-markdown MARKDOWN_FORMAT_PATH="testdata/no-such-dir/*.md"

  test-actions-mk:
    needs: workflow-config
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.workflow-config.outputs.os_unix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: lint-actions (installs actionlint on demand)
        run: make -f actions.mk lint-actions ACTIONS_LINT_PATH=testdata

  test-uv-mk:
    needs: workflow-config
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.workflow-config.outputs.os_unix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # ratchet:astral-sh/setup-uv@v10.3.2
        with:
          activate-environment: true

      - name: install-invoke
        run: make -f uv.mk install-invoke

      - name: check invoke is installed
        run: uv pip show invoke

      - name: check invoke-tasklib is installed
        run: uv pip show invoke-tasklib

      - name: check invoke-tasklib version
        run: |
          uv pip show invoke-tasklib | grep -E '^Version: (0\.0\.([8-9]|[1-9][0-9])|0\.[1-9]|[1-9])'

      - name: check env tasks are available
        run: |
          echo "from invoke_tasklib import ns" > tasks.py
          inv --list | grep -E 'env\.create-venv'
          inv --list | grep -E 'env\.install'

      - name: check env tasks run through uv run
        run: |
          uv run inv --list | grep -E 'env\.create-venv'
          uv run inv --list | grep -E 'env\.install'
