# Formats this repo's own YAML, Makefile, shell, TOML, and Markdown files weekly,
# opening a pull request when anything drifted out of format.
# It runs `make format` of the root Makefile instead of durandtibo/format-files-action, which
# expects the shared Makefiles to be vendored in .make/ (this repo is their source).

name: Format (bot)

on:
  schedule:
    - cron: "0 6 * * 5" # Run every Friday at 6:00 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # actions/checkout only needs read; the app token grants write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # ratchet:actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.TIBOT_CLIENT_ID }}
          private-key: ${{ secrets.TIBOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      - name: Format files
        run: |
          make format

      - name: Create pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # ratchet:peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/format-files
          title: "style: format files"
          commit-message: "style: format files"
          body: Format YAML, Makefile, shell, TOML, and Markdown files with `make format`.
          delete-branch: true
